version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: chatapp-postgres-test
    environment:
      POSTGRES_DB: chatapp_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: chatapp-redis-test
    ports:
      - "6380:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chatapp-rabbitmq-test
    ports:
      - "5673:5672"
      - "15673:15672"