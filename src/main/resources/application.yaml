server:
  port: ${PORT:5050}
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatdb}
    username: ${SPRING_DATASOURCE_USERNAME:eskil}
    password: ${SPRING_DATASOURCE_PASSWORD:password1}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 0
      data-source-properties:
        prepareThreshold: 0

  jpa:
    open-in-view: false
    database: postgresql
    show-sql: false
    hibernate:
      ddl-auto: none

  flyway:
    baseline-on-migrate: true
    placeholders:
      admin.password: ${admin.password}

  web:
    error:
      include-message: always
  data:
    redis:
      url: ${SPRING_REDIS_URL:redis://localhost:6379}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VHOST:}
    ssl:
      enabled: ${SPRING_RABBITMQ_SSL:false}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    default: dev

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.web: INFO
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
    com.blikeng.chatapp: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ChatApp
    description: Real-time messaging service
    version: 1.0

rate-limit:
  login:
    max-tokens: 5
  register:
    max-tokens: 10
  edit-user:
    max-tokens: 3
  edit-password:
    max-tokens: 3
  others:
    max-tokens: 60

chat:
  flush:
    fixedDelayMs: 10000
  ping:
    sweepDelayMs: 30000
    ttlMs: 60000

admin:
  password: ${ADMIN_PASSWORD:$2a$04$o28fE4YRCTx2sn4ymsnRCu3cPfzTX.0yvzW9yaZiv8ZaYUJaj/mOe}

app:
  crypto:
    messageKeyV1B64: ${APP_MESSAGE_KEY_V1_B64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  jwt:
    secret: ${JWT_SECRET:superSecretKeyForTheDevelopmentWhichIsAbsolutelySecureEnoughAndFarEnoughBitsToBeAbleToBeMadeIntoASecureEnoughKey}