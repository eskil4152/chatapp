rate-limit:
  login:
    max-tokens: 10000000
  register:
    max-tokens: 10000000
  edit-user:
    max-tokens: 10000000
  edit-password:
    max-tokens: 10000000
  others:
    max-tokens: 1000000000

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5434/chatapp_test
    username: test
    password: test
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 0
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update

  rabbitmq:
    host: localhost
    port: 5673
  data:
    redis:
      host: localhost
      port: 6380